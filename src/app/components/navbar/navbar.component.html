<nav class="navbar" [class.navbar--scrolled]="isScrolled()">
  <div class="navbar__inner">

    <!-- Brand (left) -->
    <div class="navbar__brand">
      <button *ngIf="isCormanPage(); else csmsBrand" class="navbar__back-btn" (click)="goHome()">
        <span aria-hidden="true">←</span>
        Back to CSMS
      </button>
      <ng-template #csmsBrand>
        <img src="/assets/logo.png" alt="Company Logo" class="navbar__brand-logo" />
      </ng-template>
    </div>

    <!-- Desktop pill (center) -->
    <div class="navbar__pill navbar__pill--desktop">
      <button class="navbar__pill-btn" [class.active]="activeSection() === 'home'"     (click)="navigateToSection('home')">Home</button>
      <button class="navbar__pill-btn" [class.active]="activeSection() === 'about'"    (click)="navigateToSection('about')">About Us</button>
      <button class="navbar__pill-btn" [class.active]="activeSection() === 'services'" (click)="navigateToSection('services')">Services</button>
      <button class="navbar__pill-btn" [class.active]="activeSection() === 'contact'"  (click)="navigateToSection('contact')">Contact</button>
      <button class="navbar__pill-btn navbar__pill-btn--corman" [class.active]="isCormanPage()" (click)="goToCorman()">CorMan JV</button>
    </div>

    <!-- Hamburger (center on mobile) -->
    <button class="navbar__hamburger" (click)="toggleMenu()" [class.open]="menuOpen()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- CTA (right) -->
    <div class="navbar__right">
      <button class="navbar__cta" (click)="getInTouch.emit()">Get in Touch</button>
    </div>

  </div>

  <!-- Mobile dropdown menu -->
  <div class="navbar__mobile-menu" [class.navbar__mobile-menu--open]="menuOpen()">
    <button class="navbar__mobile-btn" [class.active]="activeSection() === 'home'"     (click)="navigateToSection('home');     closeMenu()">Home</button>
    <button class="navbar__mobile-btn" [class.active]="activeSection() === 'about'"    (click)="navigateToSection('about');    closeMenu()">About Us</button>
    <button class="navbar__mobile-btn" [class.active]="activeSection() === 'services'" (click)="navigateToSection('services'); closeMenu()">Services</button>
    <button class="navbar__mobile-btn" [class.active]="activeSection() === 'gallery'"  (click)="navigateToSection('gallery');  closeMenu()">Gallery</button>
    <button class="navbar__mobile-btn" [class.active]="activeSection() === 'contact'"  (click)="navigateToSection('contact');  closeMenu()">Contact</button>
    <button class="navbar__mobile-btn navbar__mobile-btn--corman" [class.active]="isCormanPage()" (click)="goToCorman(); closeMenu()">CorMan JV</button>
  </div>
</nav>
